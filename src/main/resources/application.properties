spring.application.name=central-de-chamados

# Conexao com o PostgreSQL que roda no Docker (ver docker-compose.yml)
spring.datasource.url=jdbc:postgresql://localhost:5434/central_chamados
spring.datasource.username=chamados
spring.datasource.password=chamados

# Quem cria e altera as tabelas e o Flyway; o Hibernate so confere se as entidades batem com o banco
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
